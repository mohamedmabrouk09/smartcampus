apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartcampus
  labels:
    app: smartcampus
spec:
  replicas: 3
  selector:
    matchLabels:
      app: smartcampus
  template:
    metadata:
      labels:
        app: smartcampus
    spec:
      containers:
        - name: smartcampus
          image: smartcampus:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: smartcampus-config
            - secretRef:
                name: smartcampus-secrets
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: data
          emptyDir: {}